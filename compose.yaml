services:
  analyzer:
    build: .
    image: nmap-analyzer-analyzer:latest
    container_name: nmap-terrain-analyzer
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "80:8080"
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./keys:/keys:ro
